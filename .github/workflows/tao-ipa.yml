name: Tao IPA va Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tao-ipa-va-release:
    runs-on: macos-15

    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai XcodeGen
        run: brew install xcodegen

      - name: Tao Xcode project
        run: xcodegen generate

      - name: Build ung dung
        run: |
          set -e
          xcodebuild \
            -project TinhCongSanLuong.xcodeproj \
            -scheme TinhCongSanLuong \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Dong goi IPA
        run: |
          set -e
          APP_PATH="DerivedData/Build/Products/Release-iphoneos/TinhCongSanLuong.app"
          IPA_PATH="TinhCongSanLuong-unsigned.ipa"
          test -d "$APP_PATH"
          rm -rf Payload "$IPA_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "$IPA_PATH" Payload
          test -f "$IPA_PATH"
          ls -lh "$IPA_PATH"

      - name: Tao thong tin phien ban
        id: version
        shell: bash
        run: |
          TAG="v$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Luu IPA vao Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinhCongSanLuong-unsigned
          path: TinhCongSanLuong-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Tao Release va tai IPA len
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Tinh Cong San Luong ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Bản IPA chưa ký dành cho iPhone.
            Unsigned IPA for iPhone.

            Cập nhật thống kê giờ, sản lượng trung bình, ngày hiện tại và lịch âm.
            Updated hour statistics, average productivity, current-day highlight, and lunar calendar.

            Tải IPA trong Assets rồi ký bằng ESign.
            Download the IPA from Assets and sign it with ESign.
          files: TinhCongSanLuong-unsigned.ipa
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
