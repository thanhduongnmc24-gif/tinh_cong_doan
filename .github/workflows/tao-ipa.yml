name: Tao IPA khong ky
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tao-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Cai XcodeGen
        run: brew install xcodegen
      - name: Tao Xcode project
        run: xcodegen generate
      - name: Build app
        run: |
          xcodebuild -project TinhCongSanLuong.xcodeproj -scheme TinhCongSanLuong -configuration Release -sdk iphoneos -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Dong goi IPA
        run: |
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/TinhCongSanLuong.app Payload/
          zip -r TinhCongSanLuong-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TinhCongSanLuong-unsigned
          path: TinhCongSanLuong-unsigned.ipa
