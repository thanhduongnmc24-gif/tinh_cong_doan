name: Tao IPA va Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tao-ipa-va-release:
    runs-on: macos-15

    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai XcodeGen
        run: brew install xcodegen

      - name: Tao Xcode project
        run: xcodegen generate

      - name: Build ung dung
        run: |
          set -e

          xcodebuild \
            -project TinhCongSanLuong.xcodeproj \
            -scheme TinhCongSanLuong \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Dong goi IPA
        run: |
          set -e

          APP_PATH="DerivedData/Build/Products/Release-iphoneos/TinhCongSanLuong.app"
          IPA_PATH="TinhCongSanLuong-unsigned.ipa"

          if [ ! -d "$APP_PATH" ]; then
            echo "Khong tim thay file ung dung tai: $APP_PATH"
            exit 1
          fi

          rm -rf Payload
          rm -f "$IPA_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -qry "$IPA_PATH" Payload

          if [ ! -f "$IPA_PATH" ]; then
            echo "Khong tao duoc file IPA"
            exit 1
          fi

          echo "Da tao IPA:"
          ls -lh "$IPA_PATH"

      - name: Tao thong tin phien ban
        id: version
        shell: bash
        run: |
          TAG="v$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Ten phien ban: $TAG"

      - name: Luu IPA vao Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinhCongSanLuong-unsigned
          path: TinhCongSanLuong-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Tao Release va tai IPA len
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Tính Công Sản Lượng ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Bản IPA chưa ký dành cho iPhone.

            Tải file TinhCongSanLuong-unsigned.ipa trong phần Assets,
            sau đó ký và cài đặt bằng ESign.
          files: |
            TinhCongSanLuong-unsigned.ipa
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}